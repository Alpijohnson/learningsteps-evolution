apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: learningsteps-kv
  namespace: learningsteps
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "942c5682-3516-45c6-8886-b545aaac0b88"
    keyvaultName: kv-lsevo-cybersec
    tenantId: "c0531484-50fa-4ff2-97df-b1f2d4810603"
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
  secretObjects:
    - secretName: learningsteps-secrets
      type: Opaque
      data:
        - objectName: database-url
          key: DATABASE_URL