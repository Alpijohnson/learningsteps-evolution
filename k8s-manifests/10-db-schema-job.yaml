apiVersion: batch/v1
kind: Job
metadata:
  name: db-schema
  namespace: learningsteps
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: learningsteps-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c", "psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /sql/database_setup.sql"]
          env:
            - name: HOME
              value: /tmp
            - name: PGSSLMODE
              value: require
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: learningsteps-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: sql
              mountPath: /sql
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: sql
          configMap:
            name: db-schema
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: learningsteps-kv